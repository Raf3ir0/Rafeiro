<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rafeiro - Volumes</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      background-color: #f4f4f4;
      text-align: center;
      color: black;
      margin: 20;
      padding: 0;
      font-size: 18px;
    }

    .content {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .volume-section {
      margin: 40px 0;
      padding: 30px 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .volume-title {
      font-size: 1.8em;
      font-weight: bold;
      margin-bottom: 30px;
      text-transform: uppercase;
      color: #333;
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

 .chapter-btn {
    display: inline-block;
    text-decoration: none;
    transition: transform 0.3s ease;
}

.chapter-btn img {
    display: block;
    width: 220px; /* ajuste ao tamanho da imagem */
    height: auto;
}

.chapter-btn:hover img {
    transform: scale(1.05);
}

    .scroll-btn {
      position: fixed;
      left: 0px;
      bottom: 100px;
      width: 100px;
      height: 100px;
      cursor: pointer;
      z-index: 1000;
      opacity: 0.7;
      transition: opacity 0.3s, transform 0.3s;
    }

    .scroll-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .scroll-btn.up img {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <!-- Banner -->
  <div class="banner">
    <a href="index.html" class="logo-link">
      <img src="logos/casa logo.png" alt="Logo" class="logo">
    </a>
  </div>

  <!-- Botão para versão inglesa -->
  <a href="listadecpitulosing.html" class="lang-btn">ENG</a>

  <!-- Menu de navegação -->
  <nav class="menu">
    <a href="listabase.html">capítulos</a>
    <a href="cidadedachuva.html">último Capítulo</a>
    <a href="listadecapitulos.html">volumes</a>
    <a href="rascunhos.html">Rascunhos</a>
    <a href="projetorafeiro.html">SOBRE</a>
  </nav>

  <main class="content">
    <!-- VOLUME 2X0 -->
    <div class="volume-section">
      <h1 class="volume-title">VOLUME 2X0</h1>
      <div class="chapter-list">
        <a href="cap0x4-hub.html" class="chapter-btn">
    <img src="cidadedachuva/capa.png" alt="Ler Capítulo">
</a>
        <a href="cap0x3-hub.html" class="chapter-btn">
    <img src="belezapt/capa.png" alt="Ler Capítulo">
</a>
    </div>

    <!-- VOLUME 1X0 -->
    <div class="volume-section">
      <h1 class="volume-title">VOLUME 1X0</h1>
      <div class="chapter-list">
        <a href="cap0x2-hub.html" class="chapter-btn">
    <img src="cp2/p1.png" alt="Ler Capítulo">
</a>
       <a href="cap0x1-hub.html" class="chapter-btn">
    <img src="cp1/3b.png" alt="Ler Capítulo">
</a>
    </div>
  </main>

  <!-- Botão único -->
  <div id="scrollBtn" class="scroll-btn">
    <img src="logos/LOGOverticalcortado.png" alt="Scroll">
  </div>


  <script>
    
    const scrollBtn = document.getElementById("scrollBtn");

    scrollBtn.addEventListener("click", () => {
      if (
        window.innerHeight + window.scrollY >=
        document.body.scrollHeight - 50
      ) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth",
        });
      }
    });

    // Atualizar posição do botão
    function updateScrollBtn() {
      const atBottom =
        window.innerHeight + window.scrollY >=
        document.body.scrollHeight - 50;
      scrollBtn.classList.toggle("up", atBottom);
    }

    window.addEventListener("scroll", updateScrollBtn);
  </script>
</body>
</html>


</style>
