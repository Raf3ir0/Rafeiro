    body {

      color: black;
      margin: 20;

      font-size: 18px;
    }

    .hub-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .capa-img {
      max-width: 30%;
      height: auto;
      display: block;
      margin: 30px auto;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .chapter-title {
      font-size: 1.8em;
      font-weight: bold;
      margin: 20px 0;
      text-transform: uppercase;
    }

    .chapter-subtitle {
      font-size: 1.3em;
      color: #666;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .parts-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 30px 0;
    }

    .parts-list a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background-color: #000000;
      padding: 12px 24px;
      border-radius: 4px;
      font-weight: bold;
      transition: background-color 0.3s ease;
      font-size: 1.1em;
    }

    .parts-list a:hover {
      background-color: #005fa3;
    }
  </style>
</head> 

<body>

  <!-- Banner -->

  <!-- Botão para versão inglesa -->

    <a href="sketches.html">Rascunhos</a>

  </nav>

    <h1 class="chapter-title">Beauty City</h1>
    <h2 class="chapter-subtitle">Chapter 0x3</h2>

    <img src="belezapt/capa.png" alt="Capa do Capítulo 0x3" class="capa-img">

    <div class="parts-list">

  <!-- Botão único -->
  <div id="scrollBtn" class="scroll-btn">
    <img src="logos/LOGOverticalcortado.png" alt="Scroll" />
  </div>

  <script>
    const scrollBtn = document.getElementById("scrollBtn");

    scrollBtn.addEventListener("click", () => {
      if (
        window.innerHeight + window.scrollY >=
        document.body.scrollHeight - 50
      ) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth",
        });
      }
    });

    // Funções para atualizar posição do botão
    function updateScrollBtn() {
      const atBottom =
        window.innerHeight + window.scrollY >=
        document.body.scrollHeight - 50;
      scrollBtn.classList.toggle("up", atBottom);
    }

    window.addEventListener("scroll", updateScrollBtn);
  </script>
</body>
